[package]
name = "ygocarder"
version = "2.6.2"
description = "Yu-Gi-Oh! custom card maker"
authors = ["christianbraghette"]
license = "MIT"
repository = "https://github.com/lauqerm/ygocarder"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
